name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add cache-busting version to assets
        run: |
          sed -i "s|href=\"./styles.css\"|href=\"./styles.css?v=${GITHUB_SHA}\"|; s|src=\"./app.js\"|src=\"./app.js?v=${GITHUB_SHA}\"|" index.html
          grep -q "app.js?v=${GITHUB_SHA}" index.html && grep -q "styles.css?v=${GITHUB_SHA}" index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
